name: Port of Mokha
description: >-
  Port of Mokha is a specialty coffee company founded by Mokhtar Alkhanshali
  that sources rare, high-scoring single-origin coffee from Yemen and brings it
  to the international specialty market. Known for record-setting Coffee Review
  scores and curated offerings such as the Timeless Mokha Blend and The Yemen
  Trilogy, it also runs a wholesale program and publishes brewing guides. The
  business operates as a direct-to-consumer Shopify storefront; it exposes no
  public API, developer portal, or technical documentation. This API Evangelist
  profile was surfaced as a 500 Global portfolio company and enriched as a
  retail (non-API) company record.
